<script>
/* ==========================================================================
   THE FIRST 30 MINUTES — fictional composite incident, Cedar Falls.
   No real event, people, or organization is depicted. Platform names below
   are invented parodies, not real services. All post content, usernames,
   and comments are synthetic and written for this training scenario only.

   The scenario also models a real dynamic in online misinformation: an
   unverified or poorly-timed "correction" can itself draw out and amplify
   hateful backlash against the group being falsely blamed, and accounts
   with larger followings do outsized damage when they share it. That
   backlash is depicted here only in mild, non-graphic, clearly-labeled
   form — enough to teach the pattern, not to reproduce real hate speech.
========================================================================== */

const ORIGIN_PLATFORM = "chirp";
const PASSIVE_INTERVAL_SECONDS = 25; // harder pacing: a new development happens on its own about every 25s

/* At least 8 paraphrased versions of the same false claim — one is picked at random
   each playthrough so the opening post isn't identical every run. */
const SEED_TEXT_VARIANTS = [
  "Mosque members violently attacked town hall attendees who objected to the expansion tonight. Assault caught on video.",

  "Unreal what happened at the town hall tonight. Mosque members reportedly attacked people who objected to the expansion plan. There's video going around.",
  "Hearing that attendees who pushed back on the mosque expansion got physically attacked by mosque members at tonight's meeting. Video's already circulating.",
  "So the town hall over the mosque expansion just turned physical — mosque members allegedly went after the people objecting. Caught on someone's phone.",
  "Video is spreading of mosque members attacking town hall attendees tonight after they raised objections to the expansion. Can't believe this happened here.",
  "People who spoke against the mosque expansion at tonight's town hall say they were violently confronted by mosque members. It's all on video.",
  "This just happened — town hall attendees opposing the mosque expansion got attacked by mosque members tonight, apparently caught on video."
];

const PLATFORMS = [
  { id: "chirp",       name: "Chirp",      icon: "🐦",
    username: "@millbrook_watch" },
  { id: "reelz",       name: "Reelz",      icon: "▶️" },
  { id: "facewall",    name: "Facewall",   icon: "📘" },
  { id: "gossiphole",  name: "GossipHole", icon: "👽" },
  { id: "whisperline", name: "WhisperLine",icon: "✈️" },
  { id: "wireline",    name: "Wireline",   icon: "📰" }
];

/* ---------- helpers ---------- */
function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function pickN(arr, n) {
  const copy = arr.slice(); const out = [];
  while (out.length < n && copy.length) { out.push(copy.splice(Math.floor(Math.random() * copy.length), 1)[0]); }
  return out;
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function formatK(n) {
  if (!n) return "0";
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "K";
  return String(n);
}
/* Pick a random item from a pool without repeating one already used this playthrough.
   Tracks usage on the game state (by object identity) so the same pool can be drawn
   from in multiple places without handing back a duplicate. Once every item in the
   given pool has been used, that pool's history clears so the run can keep going. */
function pickUnique(s, pool) {
  if (!s.usedPosts) s.usedPosts = new Set();
  let available = pool.filter(item => !s.usedPosts.has(item));
  if (available.length === 0) {
    pool.forEach(item => s.usedPosts.delete(item));
    available = pool.slice();
  }
  const item = pickRandom(available);
  s.usedPosts.add(item);
  return item;
}

/* Bigger accounts do outsized damage when sharing harmful content: 0 followers -> 1x, ~25K -> 2x, ~50K+ -> ~3x (capped). */
function followerMultiplier(n) {
  return 1 + Math.min(n || 0, 60000) / 25000;
}

/* current -> value scaled between lowVal (at/under lowThresh) and highVal (at/over highThresh) */
function scaledIncrement(current, lowThresh, highThresh, lowVal, highVal) {
  if (current <= lowThresh) return lowVal;
  if (current >= highThresh) return highVal;
  const t = (current - lowThresh) / (highThresh - lowThresh);
  return lowVal + t * (highVal - lowVal);
}

/* Exponential harmful-reach bump — starts small (~0.25 at h=0) and accelerates
   steeply as the situation worsens. At h=50 ≈ 1.6× base, h=80 ≈ 4.8× base.
   Use `base` to tune the starting magnitude per context. */
function exponentialHarmBump(h, base) {
  if (base === undefined) base = 0.25;
  return base * Math.exp(h * 0.037);
}

/* ---------- comment pools (2-3 negative + 1 positive per post, generated) ---------- */
const NEGATIVE_COMMENTS = [
  "this is exactly what everyone's been saying for years",
  "why does this always get covered up",
  "nobody's surprised here, let's be honest",
  "here we go again...",
  "sure, and I'm sure it's all just 'misunderstood' 🙄",
  "wonder how fast this gets buried",
  "typical, no one wants to say the obvious part out loud",
  "adding this to the list, honestly"
];
const POSITIVE_COMMENTS = [
  "let's wait for actual facts before piling on",
  "this take doesn't sit right with me, can we slow down",
  "appreciate someone actually pushing back here",
  "let's not do this to an entire community over one unverified post",
  "genuinely don't think we know enough yet to say any of this"
];
const HANDLES = [
  "@localdad22", "@cedarfalls_res", "u/skeptical_sam", "u/newshound22", "@anon_2381",
  "Karen M.", "Tom R.", "Denise P.", "member_884", "member_112", "@cf_watchdog",
  "u/cf_local_312", "@cf_resident", "truthseeker99", "concernedmom"
];
function generateComments(s) {
  const awareness = s ? s.awareness : 0;
  const harmful = s ? s.harmfulReach : 3;
  const lead = awareness - harmful;

  if (lead >= 15) {
    const posCount = Math.random() < 0.5 ? 3 : 4;
    return shuffle(pickN(POSITIVE_COMMENTS, Math.min(posCount, POSITIVE_COMMENTS.length))
      .map(text => ({ user: pickRandom(HANDLES), text, tone: "pos" })));
  }
  if (lead >= 0) {
    const posCount = Math.random() < 0.5 ? 2 : 3;
    const negCount = Math.max(1, 4 - posCount);
    return shuffle([
      ...pickN(POSITIVE_COMMENTS, Math.min(posCount, POSITIVE_COMMENTS.length)).map(text => ({ user: pickRandom(HANDLES), text, tone: "pos" })),
      ...pickN(NEGATIVE_COMMENTS, Math.min(negCount, NEGATIVE_COMMENTS.length)).map(text => ({ user: pickRandom(HANDLES), text, tone: "neg" }))
    ]);
  }

  const negCount = Math.random() < 0.5 ? 2 : 3;
  const negs = pickN(NEGATIVE_COMMENTS, negCount).map(text => ({ user: pickRandom(HANDLES), text, tone: "neg" }));
  const pos = { user: pickRandom(HANDLES), text: pickRandom(POSITIVE_COMMENTS), tone: "pos" };
  return shuffle([...negs, pos]);
}

/* ---------- background chatter & escalation pools ----------
   Large pools so a full playthrough can draw new, non-repeating posts —

  { platformId: "reelz",      author: "millbrook_daily", followers: 6200,  text: "this is all anyone's talking about tonight, wild", tag: null },
  { platformId: "gossiphole", author: "u/quiet_observer",followers: 340,   text: "lurking this thread, nobody actually knows anything yet huh", tag: null },
  { platformId: "chirp",      author: "@cf_nightowl",    followers: 780,   text: "just refreshed and there's like 200 more replies since I last checked", tag: null },
  { platformId: "facewall",   author: "Denise P.",       followers: 95,    text: "my neighbor said her cousin was there, still waiting to hear back from her", tag: null },
  { platformId: "whisperline",author: "member_206",      followers: 88,    text: "screenshotting all of this before it inevitably gets deleted", tag: null },
  { platformId: "reelz",      author: "cf_clips",        followers: 3300,  text: "clipped the video for anyone who missed the original post", tag: null },
  { platformId: "gossiphole", author: "u/threadwatcher", followers: 512,   text: "this jumped from 12 comments to over 300 in like an hour", tag: null },
  { platformId: "chirp",      author: "@localdad22",     followers: 150,   text: "half my feed is this right now, other half is people arguing about it", tag: null },
  { platformId: "wireline",   author: "cf_press_watch",  followers: 900,   text: "still no official statement from anyone, just a lot of people talking past each other", tag: null },

// Invented fake-news-style outlets with large followings, spreading fabricated escalations.
const FAKE_NEWS_POSTS = [
  { platformId: "reelz",       author: "Cedar Falls Truth Network", followers: 24000, text: "BREAKING (unverified): witnesses now say this wasn't the first \"incident\" tied to that mosque this year.", tag: "hostile" },

// trust & safety cases.

const DETAIL_ESCALATION_POSTS = [
  { platformId: "chirp",      author: "@cf_resident88",  followers: 2100, text: "someone in the video said something in Arabic right before it happened, anyone know what that means", tag: "hostile" },

function spawnPost(s, platformId, author, followers, text, tag, comments, meta = {}) {
  const p = s.platforms.find(x => x.id === platformId);
  if (!p) return;
  p.feed.unshift({
    author, followers: followers || 0, text, tag: tag || null, t: s.elapsedSeconds,
    comments: comments || generateComments(s),
    caseEligible: !!meta.caseEligible,
    postType: meta.postType || "mellow"
  });
  p.unlocked = true;
  if (s.selectedPlatform !== platformId) p.unread = true;
  s.lastPostTime = s.elapsedSeconds; // resets the passive-spread cooldown any time ANY post appears
}

function spawnFiller(s) {
  const awarenessLead = s.awareness - s.harmfulReach;
  const harmfulHigh = s.harmfulReach >= 65;
  const harmfulSuperHigh = s.harmfulReach >= 85;

  let item, isEscalation = false, meta = {};

  // As awareness overtakes harmful reach, deliberately populate the feed with
  // more positive/contextual material.
  if (awarenessLead >= 15) {
    item = pickUnique(s, POSITIVE_BACKGROUND_POSTS);
    meta = { caseEligible: false, postType: "positive" };
  } else if (awarenessLead >= 0) {
    item = Math.random() < 0.65
      ? pickUnique(s, POSITIVE_BACKGROUND_POSTS)
      : pickUnique(s, FILLERS);
    meta = { caseEligible: false, postType: item.tag === "positive" ? "positive" : "mellow" };
  } else if (harmfulSuperHigh) {
    // Keep the game mechanics overtly hostile at very high harmful reach.
    // The content itself remains non-graphic and avoids slurs.
    item = Math.random() < 0.75
      ? pickUnique(s, DETAIL_ESCALATION_POSTS)
      : pickUnique(s, FAKE_NEWS_POSTS);
    isEscalation = true;
    meta = { caseEligible: item.platformId !== "wireline", postType: "identity_targeting_hostility" };
  } else if (harmfulHigh) {
    item = Math.random() < 0.65
      ? pickUnique(s, DETAIL_ESCALATION_POSTS)
      : pickUnique(s, FAKE_NEWS_POSTS);
    isEscalation = true;
    meta = { caseEligible: true, postType: "unverified_detail" };
  } else {
    const roll = Math.random();
    if (roll < 0.45) { item = pickUnique(s, FILLERS); meta = { caseEligible: false, postType: "mellow" }; }
    else if (roll < 0.70) { item = pickUnique(s, FAKE_NEWS_POSTS); isEscalation = true; meta = { caseEligible: false, postType: "news" }; }
    else { item = pickUnique(s, DETAIL_ESCALATION_POSTS); isEscalation = true; meta = { caseEligible: true, postType: "unverified_detail" }; }
  }

  spawnPost(s, item.platformId, item.author, item.followers, item.text, item.tag, undefined, meta);

  if (isEscalation && !s.verified) {
    const bump = exponentialHarmBump(s.harmfulReach) * followerMultiplier(item.followers);
    s.harmfulReach += bump;
    addLog(s, "Meanwhile", `${item.author} (${formatK(item.followers)} followers) adds: "${item.text}" (+${bump.toFixed(1)} harmful reach)`);
  } else if (isEscalation && s.verified) {
    addLog(s, "Meanwhile", `${item.author} (${formatK(item.followers)} followers) adds: "${item.text}" — but with the facts already out, it barely moves anything now.`);
  }
}

function addLog(s, label, text) {
  s.log.unshift({ t: s.elapsedSeconds, label, text });

/* Shared logic for any "post" action (public correction or independent
   awareness post). What matters is whether you're VERIFIED, not how early
   or late you post:
   - Verified: both meters move, but awareness moves further. Posting early
     is fine as long as it's accurate.
   - Unverified: harmful reach jumps more, awareness barely moves, and it
     draws a specific backlash framing it as you protecting your own
     community rather than telling the truth — not just "a hostile reply." */
function applyPostEffect(s, targetPlatformId, actionLabel) {
  s.hasPublished = true;
  const pre = s.harmfulReach;
  if (s.verified) {
    const balance = s.awareness - pre;
    const base = Math.max(1.5, 3 + (pre / 100) * 3 - Math.max(0, balance) / 30);
    const awarenessGain = base * (balance >= 0 ? 2.0 : 1.45);
    s.harmfulReach += base;
    s.awareness += awarenessGain;
    addLog(s, actionLabel, `Posted with confirmed facts attached — credible, and it reaches people either way. (+${awarenessGain.toFixed(1)} awareness, +${base.toFixed(1)} harmful reach)`);

    if (Math.random() < 0.45) {
      const v = pickUnique(s, HOSTILE_REPLY_VARIANTS);
      const secInc = 1 * followerMultiplier(v.followers);
      s.harmfulReach += secInc;
      spawnPost(s, targetPlatformId, v.author, v.followers, v.text, "hostile");
      addLog(s, "Reply received", `${v.author} (${formatK(v.followers)} followers) pushes back anyway, even with the facts out. (+${secInc.toFixed(1)} harmful reach)`);
    }
  } else {
    const base2 = 6 + (pre / 100) * 7; // deliberately risky before verification
    s.harmfulReach += base2;
    s.awareness += 1;
    addLog(s, actionLabel, `Posted without anything verified to back it up — it reads like a bare denial. (+${base2.toFixed(1)} harmful reach)`);

    const v = pickUnique(s, UNVERIFIED_BACKLASH_VARIANTS);
    const secInc = 3.5 * followerMultiplier(v.followers);
    s.harmfulReach += secInc;
    spawnPost(s, targetPlatformId, v.author, v.followers, v.text, "hostile");
    addLog(s, "Reply received", `${v.author} (${formatK(v.followers)} followers) frames it as you protecting your own community instead of telling the truth. (+${secInc.toFixed(1)} harmful reach)`);
  }
}

function formatTime(totalSeconds) {
  const m = Math.floor(totalSeconds / 60);
  const s = Math.floor(totalSeconds % 60);
  return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}

function clampMeters() {
  state.harmfulReach = Math.min(100, Math.max(0, state.harmfulReach));
  state.awareness = Math.min(100, Math.max(0, state.awareness));
}

function checkEnd() {
  if (state.ended) return;
  if (state.harmfulReach >= 100) {
    state.ended = true; state.outcome = "harmful";
  } else if (state.awareness >= 100) {
    state.ended = true; state.outcome = "awareness";
  } else if (state.elapsedSeconds >= 1800) {
    // 30-minute hard limit — whoever's ahead when time runs out wins
    state.ended = true;
    state.outcome = state.awareness > state.harmfulReach ? "awareness" : "harmful";
    state.timeExpired = true;
  }
  if (state.ended) stopTimer();
}

   more than one new background post at a time. This only fires once at least
   PASSIVE_INTERVAL_SECONDS have passed since the last post of ANY kind (action
   or background), so a single long action can never dump several posts at once —
   it just spawns at most one, then the cooldown restarts from there. Once the
   facts are verified, this stops adding harmful reach entirely. */
function checkPassiveSpread(s) {
  if (s.ended) return false;
  if (s.elapsedSeconds - s.lastPostTime < PASSIVE_INTERVAL_SECONDS) return false;
  const lead = s.awareness - s.harmfulReach;
  const verified = s.verified;

  if (lead >= 15 || (lead >= 0 && Math.random() < 0.75)) {
    const item = pickUnique(s, POSITIVE_BACKGROUND_POSTS);
    spawnPost(s, item.platformId, item.author, item.followers, item.text, item.tag, undefined, { caseEligible: false, postType: "positive" });
    addLog(s, "Meanwhile", `${item.author} (${formatK(item.followers)} followers) posts a more constructive update as awareness overtakes harmful reach.`);
  } else {
    const bump = verified ? 0 : exponentialHarmBump(s.harmfulReach);
    if (bump > 0) s.harmfulReach += bump;
    let item, meta;
    if (s.harmfulReach >= 65) {
      item = Math.random() < 0.7 ? pickUnique(s, DETAIL_ESCALATION_POSTS) : pickUnique(s, FAKE_NEWS_POSTS);
      meta = { caseEligible: true, postType: "unverified_detail" };
    } else {
      item = pickUnique(s, Math.random() < 0.55 ? FILLERS : DETAIL_ESCALATION_POSTS);
      meta = { caseEligible: item.tag === "hostile", postType: item.tag === "hostile" ? "unverified_detail" : "mellow" };
    }
    spawnPost(s, item.platformId, item.author, item.followers, item.text, item.tag, undefined, meta);
    addLog(s, "Meanwhile", bump > 0
      ? `${item.author} (${formatK(item.followers)} followers) posts — the story keeps spreading on its own. (+${bump.toFixed(1)} harmful reach)`
      : `${item.author} (${formatK(item.followers)} followers) posts, but with the facts already out, it doesn't move the needle.`);
  }
  clampMeters();
  checkEnd();
  return true;
}

function startTimer() {
  stopTimer();
  timerHandle = setInterval(() => {
    if (state.ended) { stopTimer(); return; }
    state.elapsedSeconds += 1;
    const spawned = checkPassiveSpread(state); // internally calls checkEnd when it spawns
    if (!spawned) checkEnd();                  // also check every tick for the 30-min limit
    if (state.ended) { stopTimer(); render(); return; }
    if (spawned) {
      render();
    } else {
      const t = document.getElementById("timerVal");
      if (t) t.textContent = formatTime(Math.max(0, 1800 - state.elapsedSeconds));
    }
  }, 1000);
}
function stopTimer() {
  if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
}

async function getBestTime() {
  try {
    if (window.storage) {
      const res = await window.storage.get("first30_best_time", false);
      return res ? Number(res.value) : null;
    }
  } catch (e) { /* no stored value yet */ }
  return sessionBestTime;
}
async function setBestTime(seconds) {
  sessionBestTime = seconds;
  try {
    if (window.storage) {
      await window.storage.set("first30_best_time", String(seconds), false);
    }
  } catch (e) { /* storage unavailable, in-memory fallback still applies */ }
}

function takeAction(id) {
  if (state.ended) return;
  const action = ACTIONS.find(a => a.id === id);
  if (!action || !action.enabled(state)) return;
  if (id !== "wait" && state.usedActions.has(id)) return; // one-time use, except Wait/Monitor
  state.elapsedSeconds += action.costSeconds;
  action.run(state);
  if (id !== "wait" && id !== "escalate") state.usedActions.add(id);
  // Passive background spread is checked separately on the real-time clock (see
  // startTimer) — not here — so a single action always produces exactly one new
  // post (its own outcome), never a pile-up from catching up on skipped time.
  clampMeters();
  checkEnd();
  render();
}

function selectPlatform(id) {
  const p = state.platforms.find(x => x.id === id);
  if (!p || !p.unlocked) return;
  state.selectedPlatform = id;
  p.unread = false;
  render();
}

function render() {
  if (!state.started) return renderStart();
  if (state.ended) return renderEnd();
  renderDashboard();
}

function renderStart() {
  app.innerHTML = `
    <div class="center-card">
      <h1>Chronically Online</h1>
      <p>Cedar Falls — a fictional composite scenario. You're the volunteer Response
      Coordinator. A false claim about tonight's town hall meeting is starting to spread
      across several platforms.</p>
      <ul>
        <li>The clock runs in real time and never stops — every action you take also
        adds its own time on top, so speed matters.</li>
        <li>There are two meters: <b>Harmful Reach</b> (the false claim, and the
        backlash it can trigger) and <b>Awareness</b> (accurate information actually
        reaching people).</li>
        <li>The moment either meter hits 100%, the run ends. Get Awareness there first
        and you contained it. Let Harmful Reach get there first and you didn't.</li>
        <li>Verifying facts first (news desk or your own research) makes your later
        posts land better and hit back less — but once you're verified, there's no
        reason to keep re-verifying.</li>
        <li>Once you have <b>verified facts AND published a post</b>, Wait/Monitor
        builds awareness instead of feeding harmful reach. Just verifying privately
        — without publishing — still costs you every minute you wait.</li>
        <li>Accounts with bigger followings do outsized damage when they share
        something harmful — watch the follower count on who's sharing what.</li>
        <li>The story keeps moving even if you do nothing — expect a new
        development roughly every 30 seconds, on its own, and never more than
        one at a time.</li>
        <li>Every action except <b>Wait/Monitor</b> and <b>Escalate</b> can only be
        used once. Escalate is repeatable — you can report the newest post each time
        a new one qualifies.</li>
        <li>The run ends when either meter hits 100% <b>or after 30 in-game minutes</b>
        — whichever comes first. At the 30-minute mark, whoever's ahead wins.</li>
      </ul>
      <button class="primary-btn" id="beginBtn">Start the clock</button>
    </div>
    <div class="footer-note">Fictional scenario. All names, platforms, and content are invented for training.</div>
  `;
  document.getElementById("beginBtn").addEventListener("click", () => {
    state.started = true;
    render();
    startTimer();
  });
}

function renderDashboard() {
  const sidebarHtml = state.platforms.map(p => {
    const def = PLATFORMS.find(d => d.id === p.id);
    const cls = [
      "plat-btn",
      p.unlocked ? "active" : "",
      state.selectedPlatform === p.id ? "selected" : "",
      !p.unlocked ? "locked" : "",
      p.unread ? "unread" : ""
    ].join(" ");
    return `<button class="${cls}" data-plat="${p.id}" ${!p.unlocked ? "disabled" : ""} title="${def.name}">
      ${def.icon}<span class="dot"></span>
    </button>`;
  }).join("");

  let contentHtml;
  if (!state.selectedPlatform) {
    contentHtml = `<div class="empty-state">Select a platform on the left to see what's happening there.<br>Icons light up as the story spreads to new places.</div>`;
  } else {
    const p = state.platforms.find(x => x.id === state.selectedPlatform);
    const def = PLATFORMS.find(d => d.id === p.id);
    contentHtml = p.feed.map((item, i) => {
      const likes = Math.round(30 + i * 6 + state.harmfulReach * 1.1);
      const shares = Math.round(8 + i * 2 + state.harmfulReach * 0.5);
      const tagCls = item.tag ? ` ${item.tag}` : "";
      const tagline = item.tag === "hostile" ? "flagged as hostile / biased"
        : item.tag === "credible" ? "verified source"
        : item.tag === "system" ? "system notice"
        : item.tag === "positive" ? "de-escalating"
        : item.tag === "amplify" ? "amplifying"
        : def.name;
      const followerLine = item.followers > 0 ? `${formatK(item.followers)} followers · ` : "";
      const commentsHtml = (item.comments || []).map(c =>
        `<div class="comment ${c.tone || ""}"><b>${c.user}</b> — ${c.text}</div>`
      ).join("");
      return `
        <div class="feed-item${tagCls}">
          <div class="post-header">
            <div class="avatar">👤</div>
            <div>
              <div class="post-name">${item.author}</div>
              <div class="post-tagline">${followerLine}${tagline}</div>
            </div>
          </div>
          <div class="post-text">${item.text}</div>
          <div class="post-stats">
            <span>❤ <b>${likes}</b></span>
            <span>↗ <b>${shares}</b></span>
          </div>
          ${commentsHtml ? `<div class="comments">${commentsHtml}</div>` : ""}
        </div>
      `;
    }).join("");
  }

  const actionsHtml = ACTIONS.map(a => {
    const alreadyUsed = a.id !== "wait" && a.id !== "escalate" && state.usedActions.has(a.id);
    const disabled = state.ended || alreadyUsed || !a.enabled(state);
    const reason = alreadyUsed
      ? " · already used"
      : a.id === "reply_direct" && state.selectedPlatform !== ORIGIN_PLATFORM
      ? " · only from the original post"
      : a.id === "escalate" && !state.selectedPlatform
      ? " · select a platform"
      : (a.id === "verify_poster" || a.id === "verify_news" || a.id === "own_research") && state.verified
      ? " · already verified"
      : "";
    return `
      <button class="action-btn" data-action="${a.id}" ${disabled ? "disabled" : ""} title="${a.desc}">
        <span class="action-label">${a.label}${alreadyUsed ? " ✓" : ""}</span>
        <span class="action-cost">+${a.costSeconds >= 60 ? `${Math.floor(a.costSeconds/60)}m${a.costSeconds % 60 ? ` ${a.costSeconds % 60}s` : ""}` : `${a.costSeconds}s`}${reason}</span>
      </button>
    `;
  }).join("");

  const logHtml = state.log.slice(0, 14).map((entry, i) => `
    <div class="log-entry${i === 0 ? " latest" : ""}"><span class="log-time">${formatTime(entry.t)}</span><b>${entry.label}:</b> ${entry.text}</div>
  `).join("") || `<div class="log-entry">No actions taken yet.</div>`;

  app.innerHTML = `
    <div class="dash">
      <div class="topbar">
        <div class="meters">
          <div class="meter-block">
            <span class="meter-label">Harmful reach</span>
            <div class="meter-track"><div class="meter-fill harmful" style="width:${state.harmfulReach}%"></div></div>
            <span class="meter-pct harmful">${Math.round(state.harmfulReach)}%</span>
          </div>
          <div class="meter-block">
            <span class="meter-label">Awareness</span>
            <div class="meter-track"><div class="meter-fill awareness" style="width:${state.awareness}%"></div></div>
            <span class="meter-pct awareness">${Math.round(state.awareness)}%</span>
          </div>
        </div>
        <div>
          <div class="timer-block" id="timerVal">${formatTime(Math.max(0, 1800 - state.elapsedSeconds))}</div>
          <div class="timer-sub">remaining</div>
        </div>
      </div>
      <div class="statusbar">
        
        <span class="status-chip ${state.verified ? "on" : "off"}"><span class="dotstate"></span>Have credible facts: ${state.verified ? "yes" : "no"}</span>
      </div>
      <div class="layout">
        <div class="sidebar">${sidebarHtml}</div>
        <div class="content">${contentHtml}</div>
        <div class="log-sidebar">
          <div class="log-title">📋 Incident Log</div>
          ${logHtml}
        </div>
      </div>
      <div class="actionbar">${actionsHtml}</div>
    </div>
    <div class="footer-note">Fictional training scenario · Cedar Falls incident is invented, not a real event.</div>
  `;

  state.platforms.forEach(p => {
    const btn = app.querySelector(`[data-plat="${p.id}"]`);
    if (btn && !btn.disabled) btn.addEventListener("click", () => selectPlatform(p.id));
  });
  ACTIONS.forEach(a => {
    const btn = app.querySelector(`[data-action="${a.id}"]`);
    if (btn && !btn.disabled) btn.addEventListener("click", () => takeAction(a.id));
  });
}

function renderEnd() {
  const win = state.outcome === "awareness";
  const outcome = state.timeExpired
    ? (win
        ? "Time ran out — but awareness was ahead when it did. The verified picture outpaced the false one before the 30-minute window closed."
        : "Time ran out with harmful reach in the lead. A 30-minute window wasn't enough to turn it around — the false narrative was still winning when the clock hit zero.")
    : (win
        ? "You got ahead of it. Verified information reached more people than the false claim did before real harm spread — including the Islamophobic pile-on a careless correction can trigger."
        : "The false claim won the race. By the time anything corrective broke through, the harmful narrative — including the hateful replies it drew out along the way — had already reached everyone it was going to reach.");

  app.innerHTML = `
    <div class="center-card">
      <div class="eyebrow">Run complete</div>
      <h1>${win ? "Contained" : "Not contained"}</h1>

      <div class="stat-row">
        <div class="stat-box"><div class="v ${win ? "win" : "lose"}">${formatTime(state.elapsedSeconds)}</div><div class="l">${state.timeExpired ? "Time expired" : "Time to 100%"}</div></div>
        <div class="stat-box"><div class="v">${Math.round(state.harmfulReach)}%</div><div class="l">Harmful reach</div></div>
        <div class="stat-box"><div class="v">${Math.round(state.awareness)}%</div><div class="l">Awareness</div></div>
        <div class="stat-box"><div class="v" id="bestTimeVal">—</div><div class="l">Best time (awareness win)</div></div>
      </div>

      <div class="scorebars">
        ${scoreRow("Harmful reach", state.harmfulReach, "harmful")}
        ${scoreRow("Awareness", state.awareness, "awareness")}
      </div>

      <div class="outcome-text ${win ? "win" : "lose"}">${outcome}</div>

      <button class="primary-btn" id="restartBtn">Run it again</button>
    </div>
    <div class="footer-note">Best time is saved on this device so you can try to beat it next run.</div>
  `;

  document.getElementById("restartBtn").addEventListener("click", () => {
    state = freshState();
    render();
  });

  (async () => {
    let best = await getBestTime();
    if (win && (best === null || state.elapsedSeconds < best)) {
      best = state.elapsedSeconds;
      await setBestTime(best);
    }
    const el = document.getElementById("bestTimeVal");
    if (el) el.textContent = best !== null ? formatTime(best) : "—";
  })();
}

function scoreRow(label, pct, cls) {
  const p = Math.round(Math.max(0, Math.min(100, pct)));
  return `
    <div class="label">${label}</div>
    <div class="barwrap"><div class="bar ${cls}" style="width:${p}%"></div></div>
    <div class="barval">${p}</div>
  `;
}

render();
</script>
</body>
</html>
